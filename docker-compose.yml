services:
  homespace-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: homespace-web:latest
    container_name: homespace_web_prod
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
