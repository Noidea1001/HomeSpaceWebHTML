name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: HTML Syntax & Structure Check
        run: |
          npx --yes htmlhint "*.html"

      - name: JavaScript Syntax Validation
        run: |
          node -c assets/js/main.js
          node -c assets/js/properties-engine.js
          node -c assets/js/compare-engine.js
          node -c assets/js/map-engine.js
          node -c assets/js/supabase-client.js
          node -c assets/vendor/php-email-form/validate.js
          echo "All JavaScript files validated successfully."

      - name: JSON Database & Manifest Validation
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/properties.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          echo "All JSON files parsed and validated successfully."

      - name: Verify Core File Integrity
        run: |
          test -f index.html || exit 1
          test -f properties.html || exit 1
          test -f property-details.html || exit 1
          test -f calculator.html || exit 1
          test -f admin.html || exit 1
          test -f assets/css/main.css || exit 1
          test -f assets/js/main.js || exit 1
          test -f assets/js/properties-engine.js || exit 1
          test -f assets/js/compare-engine.js || exit 1
          test -f assets/js/map-engine.js || exit 1
          test -f assets/js/supabase-client.js || exit 1
          echo "All critical assets verified successfully."

      - name: Verify Docker Container Build
        run: |
          docker build -t homespace:ci .
          echo "Production Docker container build verified."
